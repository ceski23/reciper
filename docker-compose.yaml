services:
    postgres:
        image: postgres:17.0-alpine
        restart: always
        ports:
            - '${POSTGRES_PORT}:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DATABASE}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./.data/postgres:/var/lib/postgresql/data
